# VirtualHost do Apache para hylvenbs.xyz.
#
# Módulos necessários:
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#
# A landing estática sai do DocumentRoot; /market-integrations é encaminhado
# para o app Next.js em 127.0.0.1:3000.

<VirtualHost *:80>
  ServerName hylvenbs.xyz
  ServerAlias www.hylvenbs.xyz
  RewriteEngine On
  RewriteRule ^ https://hylvenbs.xyz%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
  ServerName hylvenbs.xyz
  ServerAlias www.hylvenbs.xyz
  DocumentRoot /var/www/hylvenbs

  SSLEngine on
  SSLCertificateFile    /etc/letsencrypt/live/hylvenbs.xyz/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/hylvenbs.xyz/privkey.pem

  # www -> raiz
  RewriteEngine On
  RewriteCond %{HTTP_HOST} ^www\.hylvenbs\.xyz$ [NC]
  RewriteRule ^ https://hylvenbs.xyz%{REQUEST_URI} [L,R=301]

  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"

  # O app não deve ser indexado
  <LocationMatch "^/market-integrations">
    Header always set X-Robots-Tag "noindex, nofollow"
  </LocationMatch>

  # --- App Next.js ---------------------------------------------------------
  # O basePath do app já é /market-integrations, então o caminho é repassado
  # inteiro (sem strip) — origem e destino coincidem.
  ProxyPreserveHost On
  ProxyRequests Off
  ProxyPass        /market-integrations http://127.0.0.1:3000/market-integrations
  ProxyPassReverse /market-integrations http://127.0.0.1:3000/market-integrations

  # mod_proxy define X-Forwarded-For/Host, mas não o protocolo. Sem isto o
  # getRequestOrigin() do app monta http:// e o cookie do OAuth (secure) se perde.
  RequestHeader set X-Forwarded-Proto "https"

  # O diretório do código do app fica fora do DocumentRoot; esta negação é
  # rede de segurança caso alguém publique o repositório inteiro em /var/www.
  <Directory /var/www/hylvenbs/market-integrations>
    Require all denied
  </Directory>

  # --- Landing estática ----------------------------------------------------
  <Directory /var/www/hylvenbs>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>

  ErrorLog  ${APACHE_LOG_DIR}/hylvenbs-error.log
  CustomLog ${APACHE_LOG_DIR}/hylvenbs-access.log combined
</VirtualHost>

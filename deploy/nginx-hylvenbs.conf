# Alternativa ao Apache: server block do nginx para hylvenbs.xyz.
# Use este OU o apache-hylvenbs.conf, não os dois.
#
# Com nginx o .htaccess é ignorado — as regras equivalentes estão aqui.

server {
    listen 80;
    listen [::]:80;
    server_name hylvenbs.xyz www.hylvenbs.xyz;
    return 301 https://hylvenbs.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hylvenbs.xyz;

    ssl_certificate     /etc/letsencrypt/live/hylvenbs.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hylvenbs.xyz/privkey.pem;

    return 301 https://hylvenbs.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hylvenbs.xyz;

    root /var/www/hylvenbs;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/hylvenbs.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hylvenbs.xyz/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploads de imagem para ML/Shopee passam por aqui
    client_max_body_size 25m;

    # --- App Next.js --------------------------------------------------------
    # O basePath do app é /market-integrations, então repassamos o caminho
    # inteiro: proxy_pass sem URI final preserva o path original.
    location /market-integrations {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        # Sem isto o app monta origem http:// e o cookie secure do OAuth se perde.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming do agente (respostas incrementais) precisa de buffering off
        proxy_buffering off;
        proxy_read_timeout 300s;

        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # --- Landing estática ---------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O código do app nunca é servido como arquivo estático
    location ~ ^/market-integrations/(node_modules|\.env|package\.json) {
        return 404;
    }

    access_log /var/log/nginx/hylvenbs-access.log;
    error_log  /var/log/nginx/hylvenbs-error.log;
}
